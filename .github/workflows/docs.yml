name: Docs

# Deliberately narrow: this workflow exists for the documentation site and must
# never become a reason the main repository goes red.
#
#   * it only runs when the site's inputs actually change -- which now includes
#     src/, because the API reference is generated from the docstrings there,
#     and CHANGELOG.md, because the site serves it rather than a copy,
#   * it never touches the package build or the test suite,
#   * and it does not publish until Pages is switched on (see `deploy` below),
#     because actions/deploy-pages fails hard on a repository where Pages is
#     disabled — a failure that would have nothing to do with the code.
on:
  push:
    branches: [master, main]
    paths: &docs_inputs
      - "docs/**"
      - "src/caustica/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *docs_inputs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Only the docs extra: no solver dependencies, no compiled wheels.
      - name: Install
        run: python -m pip install -e .[docs]
      # --strict turns a broken internal link or a page missing from the nav
      # into a failed build, which is the only way the docs stay honest.
      - name: Build
        run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    # Publishing is opt-in. Turn it on once, in two steps:
    #   1. Settings -> Pages -> Source = "GitHub Actions"
    #   2. Settings -> Secrets and variables -> Actions -> Variables ->
    #      New repository variable: PUBLISH_DOCS = true
    # Until then this job is skipped, and a docs change can only ever fail on a
    # genuinely broken build.
    if: >-
      github.event_name != 'pull_request' &&
      vars.PUBLISH_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
