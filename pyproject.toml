[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "caustica"
version = "0.1.0.dev0"
description = "GPU-accelerated nonlinear acoustic simulation library — focused/therapeutic ultrasound (HIFU) first (multi-solver: k-space PSTD Westervelt/linear native, k-Wave adapter; stamped, reproducible runs)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eren Bulbul", email = "ebulbul@yildiz.edu.tr" }]
keywords = [
    "HIFU",
    "ultrasound",
    "nonlinear acoustics",
    "acoustic simulation",
    "focused ultrasound",
    "transcranial ultrasound",
    "therapeutic ultrasound",
    "PSTD",
    "Westervelt",
    "k-space",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
    "h5py>=3.9",
]

# What PyPI renders in the project sidebar; without these a wheel install is a
# dead end for anyone trying to find the docs or report a bug.
[project.urls]
Homepage = "https://github.com/ebx0/caustica"
Documentation = "https://ebx0.github.io/caustica/"
Repository = "https://github.com/ebx0/caustica"
Issues = "https://github.com/ebx0/caustica/issues"
Changelog = "https://github.com/ebx0/caustica/blob/master/CHANGELOG.md"

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.0"]
kwave = ["k-wave-python>=0.6"]
report = ["matplotlib>=3.8"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.16,<0.17",
    "matplotlib>=3.8",
    # test_packaging builds the wheel with --no-build-isolation so the suite
    # stays green offline; that needs the build backend in the dev env.
    "setuptools>=77",
]

[project.scripts]
caustica = "caustica.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The planner's GPU datasheet ships with the library — without it a wheel
# install (exactly what Colab does) breaks planner.estimate.
"caustica.planner" = ["gpu_db.json"]
# PEP 561: downstream type checkers see our annotations only with this marker.
"caustica" = ["py.typed"]
# Self-contained example jobs (no external data) — the README quickstart and
# the clean-env CI leg both run one of these from a wheel install.
"caustica.examples" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
# `apps` holds repo-level consumers (focus_study; not installed with the
# caustica wheel); tests import them from the repo root.
pythonpath = ["."]
markers = [
    "slow: long-running physics validation tests",
    "gpu: tests that require CuPy + an NVIDIA GPU (skipped when unavailable)",
    "kwave: tests that require k-wave-python + its precompiled binary",
    "network: tests that reach external services (excluded on CI)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use "magic" reference constants inline.
"tests/*" = ["E741"]
