site_name: caustica
site_description: >-
  GPU-accelerated, multi-solver acoustic simulation for HIFU and therapeutic
  ultrasound. Pure Python, one JSON job, the same run on a laptop and on Colab.
site_url: https://ebx0.github.io/caustica/
site_author: eren bulbul

repo_url: https://github.com/ebx0/caustica
repo_name: ebx0/caustica
edit_uri: edit/master/docs/

copyright: >-
  MIT-licensed. Pre-alpha: the API still moves between milestones.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # the :material-...: / :octicons-...: icon shortcodes the landing page uses
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Writing a job:
      - Job reference: job_reference.md
      - Conventions that bite: conventions.md
  - Using the library:
      - From Python: library.md
      - What has been measured: validation.md
  - Building on it:
      - Extension points: extending.md
      - Driving it from a GUI: gui_contract.md
  - Project:
      - Anatomical phantoms: uwcem.md
      - Engineering log: devlog.md
      - Library-first plan: library_first_plan.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ebx0/caustica
      name: caustica on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/caustica/
      name: caustica on PyPI

watch:
  - docs
