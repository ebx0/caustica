site_name: caustica
site_description: >-
  GPU-accelerated, multi-solver acoustic simulation for HIFU and therapeutic
  ultrasound. Pure Python, one JSON job, the same run on a laptop and on Colab.
site_url: https://ebx0.github.io/caustica/
site_author: eren bulbul

repo_url: https://github.com/ebx0/caustica
repo_name: ebx0/caustica
edit_uri: edit/master/docs/

copyright: >-
  MIT-licensed. Pre-alpha: the API still moves between milestones.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ebx0/caustica
      name: caustica on GitHub
  generator: false

extra_css:
  - stylesheets/extra.css

plugins:
  # listing any plugin replaces the implicit default, so search has to be named
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
            members_order: source
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_if_no_docstring: false
            filters: ["!^_"]
            heading_level: 3

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # the :material-...: / :octicons-...: icon shortcodes the landing page uses
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # so the site can serve the repository's own CHANGELOG rather than a copy of it
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get started:
      - Installation: install.md
      - Writing a job: job_reference.md
      - Conventions that bite: conventions.md
      - From Python: library.md
  - Examples: examples.md
  - API reference:
      - api/index.md
      - Running a simulation: api/simulate.md
      - Grid, media, materials: api/model.md
      - Geometry: api/geometry.md
      - Transducers: api/arrays.md
      - Analytic references: api/analytic.md
      - Thermal: api/thermal.md
      - Planner and results: api/planner.md
  - Evidence:
      - What has been measured: validation.md
      - Performance: benchmarks.md
  - Extending:
      - Extension points: extending.md
      - Driving it from a GUI: gui_contract.md
  - Project:
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Anatomical phantoms: uwcem.md
      - Engineering log: devlog.md
      - Library-first plan: library_first_plan.md
